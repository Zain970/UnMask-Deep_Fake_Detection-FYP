# UnMask Deployment Configuration

# Environment Settings
environment: production

# Server Configuration
server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  timeout: 120
  keepalive: 5

# Database Configuration
database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  pool_size: 20
  max_overflow: 10

# Redis Configuration
redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 0

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  algorithm: HS256
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# Storage Configuration
storage:
  type: s3
  bucket: ${S3_BUCKET}
  region: ${S3_REGION}
  access_key: ${S3_ACCESS_KEY}
  secret_key: ${S3_SECRET_KEY}
  max_file_size: 100MB

# AI Model Configuration
ai_model:
  gpu_enabled: true
  batch_size: 32
  confidence_threshold: 0.85
  max_processing_time: 300

# Logging Configuration
logging:
  level: INFO
  format: json
  file: /var/log/unmask/app.log
  max_size: 100MB
  backup_count: 5

# Monitoring Configuration
monitoring:
  enabled: true
  prometheus_port: 9090
  health_check_interval: 30

# Security Configuration
security:
  cors_origins:
    - https://app.unmask.com
    - https://api.unmask.com
  rate_limit:
    requests: 100
    period: 60
  ssl:
    enabled: true
    cert_path: /etc/ssl/certs/unmask.crt
    key_path: /etc/ssl/private/unmask.key

# Email Configuration
email:
  host: ${SMTP_HOST}
  port: ${SMTP_PORT}
  user: ${SMTP_USER}
  password: ${SMTP_PASSWORD}
  from: no-reply@unmask.com
  templates_dir: /app/email_templates

# Social Login Configuration
social_auth:
  google:
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
  github:
    client_id: ${GITHUB_CLIENT_ID}
    client_secret: ${GITHUB_CLIENT_SECRET}

# Backup Configuration
backup:
  enabled: true
  schedule: "0 0 * * *"
  retention_days: 30
  storage:
    type: s3
    bucket: ${BACKUP_BUCKET}
    path: backups/ 