{% extends "index.html" %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Upload Media for Analysis</h1>
    
    <!-- File Upload Area -->
    <div class="mb-8">
        <div id="drop-area" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center transition-all duration-300">
            <div class="mb-4">
                <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
            </div>
            <div class="text-gray-600 mb-4">
                <p class="text-lg mb-2">Drag and drop your file here</p>
                <p class="text-sm text-gray-500">or</p>
                <input type="file" id="file-input" class="hidden" accept="image/*,video/*">
                <label for="file-input" class="inline-block mt-2 px-4 py-2 bg-blue-500 text-white rounded-lg cursor-pointer hover:bg-blue-600 transition duration-300">
                    Browse Files
                </label>
            </div>
            <p class="text-sm text-gray-500 mt-4">Supported formats: JPG, PNG, MP4, MOV (Max size: 100MB)</p>
        </div>
    </div>

    <!-- File Preview -->
    <div id="file-preview" class="hidden mb-8">
        <div class="flex items-center justify-between bg-gray-50 p-4 rounded-lg">
            <div class="flex items-center">
                <div id="file-icon" class="mr-4">
                    <!-- Icon will be dynamically inserted -->
                </div>
                <div>
                    <p id="file-name" class="font-medium text-gray-800"></p>
                    <p id="file-size" class="text-sm text-gray-500"></p>
                </div>
            </div>
            <button id="remove-file" class="text-red-500 hover:text-red-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Analysis Options -->
    <div class="mb-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Analysis Options</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Model Selection -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="model-select">
                    Select Model
                </label>
                <select id="model-select" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    <option value="ensemble">Ensemble Model (Recommended)</option>
                    <option value="base">Base Model</option>
                    <option value="temporal">Temporal Model</option>
                </select>
            </div>

            <!-- Confidence Threshold -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="confidence-threshold">
                    Confidence Threshold
                </label>
                <div class="flex items-center space-x-4">
                    <input type="range" id="confidence-threshold" min="0" max="100" value="80" class="flex-1">
                    <span id="threshold-value" class="text-gray-600 w-16 text-right">80%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Processing Options -->
    <div class="mb-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Processing Options</h2>
        
        <div class="space-y-4">
            <label class="flex items-center">
                <input type="checkbox" id="enhanced-analysis" class="form-checkbox h-5 w-5 text-blue-600">
                <span class="ml-2 text-gray-700">Enhanced Analysis (More detailed results)</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" id="save-results" class="form-checkbox h-5 w-5 text-blue-600" checked>
                <span class="ml-2 text-gray-700">Save Results to History</span>
            </label>
        </div>
    </div>

    <!-- Upload Button -->
    <div class="flex justify-end">
        <button id="upload-button" class="px-6 py-3 bg-blue-500 text-white rounded-lg font-semibold hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Start Analysis
        </button>
    </div>

    <!-- Progress Bar -->
    <div id="upload-progress" class="hidden mt-8">
        <div class="w-full bg-gray-200 rounded-full h-2.5">
            <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <p id="progress-text" class="text-sm text-gray-600 mt-2 text-center">Processing...</p>
    </div>
</div>
{% endblock %}
