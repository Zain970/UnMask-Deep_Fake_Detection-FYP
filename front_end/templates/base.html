<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UnMask - Deepfake Detection System">
    <meta name="theme-color" content="#3b82f6">
    
    <!-- Responsive Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>{% block title %}UnMask{% endblock %}</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="nav-container">
        <div class="flex items-center">
            <a href="/" class="text-2xl font-bold text-primary">
                <i class="fas fa-shield-alt mr-2"></i>UnMask
            </a>
        </div>
        <div class="nav-links">
            <a href="/" class="text-gray-600 hover:text-primary">Home</a>
            <a href="/upload" class="text-gray-600 hover:text-primary">Upload</a>
            <a href="/results" class="text-gray-600 hover:text-primary">Results</a>
            <a href="/about" class="text-gray-600 hover:text-primary">About</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer-content">
        <div class="text-white">
            <p>&copy; 2024 UnMask. All rights reserved.</p>
        </div>
        <div class="footer-links">
            <a href="/privacy" class="text-white hover:text-gray-300">Privacy Policy</a>
            <a href="/terms" class="text-white hover:text-gray-300">Terms of Service</a>
            <a href="/contact" class="text-white hover:text-gray-300">Contact</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
