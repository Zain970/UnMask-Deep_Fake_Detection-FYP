<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnMask - Deepfake Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between">
                <div class="flex space-x-7">
                    <div>
                        <a href="/" class="flex items-center py-4">
                            <span class="font-semibold text-gray-500 text-lg">UnMask</span>
                        </a>
                    </div>
                    <div class="hidden md:flex items-center space-x-1">
                        <a href="/" class="py-4 px-2 text-gray-500 hover:text-gray-900">Home</a>
                        <a href="/upload" class="py-4 px-2 text-gray-500 hover:text-gray-900">Upload</a>
                        <a href="/results" class="py-4 px-2 text-gray-500 hover:text-gray-900">Results</a>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-3">
                    <a href="/login" class="py-2 px-2 font-medium text-gray-500 rounded hover:bg-gray-300 hover:text-gray-900 transition duration-300">Log In</a>
                    <a href="/register" class="py-2 px-2 font-medium text-white bg-blue-500 rounded hover:bg-blue-400 transition duration-300">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white shadow-lg mt-8">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="text-gray-500 text-sm">
                    © 2024 UnMask. All rights reserved.
                </div>
                <div class="flex space-x-4">
                    <a href="#" class="text-gray-500 hover:text-gray-900">Privacy Policy</a>
                    <a href="#" class="text-gray-500 hover:text-gray-900">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
