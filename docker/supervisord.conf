[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:app]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/app.err.log
stdout_logfile=/var/log/supervisor/app.out.log
environment=
    PYTHONPATH="/app",
    DATABASE_URL="postgresql://unmask:unmask@db:5432/unmask",
    REDIS_URL="redis://redis:6379/0"

[program:celery]
command=celery -A core.celery worker --loglevel=info
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/celery.err.log
stdout_logfile=/var/log/supervisor/celery.out.log
environment=
    PYTHONPATH="/app",
    DATABASE_URL="postgresql://unmask:unmask@db:5432/unmask",
    REDIS_URL="redis://redis:6379/0" 