name: Model Training

on:
  push:
    branches: [ main ]
    paths:
      - 'ai_model/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to use for training'
        required: true
        default: 'faceforensics++'
      epochs:
        description: 'Number of epochs'
        required: true
        default: '100'

jobs:
  train:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
        cuda-version: ['11.2']

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up CUDA ${{ matrix.cuda-version }}
      uses: actions/setup-cuda@v1
      with:
        cuda-version: ${{ matrix.cuda-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Download dataset
      run: |
        python scripts/download_dataset.py --dataset ${{ github.event.inputs.dataset }}

    - name: Train model
      env:
        DATASET: ${{ github.event.inputs.dataset }}
        EPOCHS: ${{ github.event.inputs.epochs }}
      run: |
        python ai_model/train.py --dataset $DATASET --epochs $EPOCHS

    - name: Evaluate model
      run: |
        python ai_model/evaluate.py --model weights/model.h5

    - name: Upload model weights
      uses: actions/upload-artifact@v2
      with:
        name: model-weights
        path: weights/

    - name: Upload evaluation results
      uses: actions/upload-artifact@v2
      with:
        name: evaluation-results
        path: results/

    - name: Update model documentation
      run: |
        python scripts/update_model_docs.py
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/guides/ai_model.md
        git commit -m "Update model documentation"
        git push 